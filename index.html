<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitsToBytes.IOT | Hardware & Code Hub</title>
    
    <meta name="description" content="Open source ESP32 and Arduino repositories, wiring diagrams, and source code by BitsToBytes.IOT.">
    <meta name="keywords" content="ESP32, Arduino, IoT, Electronics, Circuits">
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --bg-color: #080d1a;
            --panel-bg: #0f172a;
            --panel-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-glow: linear-gradient(135deg, #06b6d4, #3b82f6);
            --accent-teal: #06b6d4;
            --accent-green: #10b981;
            --border-glow: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* Full Screen Large Container */
        .app-layout {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        @media (min-width: 1024px) {
            .app-layout {
                grid-template-columns: 320px 1fr; /* Massive dashboard sidebar sidebar split */
            }
        }

        /* Sidebar Channel Info panel */
        .sidebar {
            background-color: var(--panel-bg);
            border-right: 1px solid #1e293b;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-zone {
            text-align: center;
        }

        .logo {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0;
            background: var(--accent-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .stats-panel {
            background: #0b0f19;
            border-radius: 12px;
            padding: 20px;
            margin: 40px 0;
            border: 1px solid #1e293b;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .stat-item:last-child { margin-bottom: 0; }
        .stat-label { color: var(--text-muted); font-family: monospace;}
        .stat-val { color: var(--accent-teal); font-weight: bold; }

        .social-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, filter 0.2s;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-yt { background: #ef4444; }
        .btn-ig { background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }

        /* Main Workspace Feed */
        .main-content {
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            box-sizing: border-box;
        }

        .section-header {
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            margin: 0;
        }

        .section-header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
        }

        /* Project Layout Panels */
        .project-board {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            padding: 35px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.5);
        }

        .project-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .project-title {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 700;
        }

        .tag-group {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .badge.blue { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge.green { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        /* Visual assets twin columns grid layout */
        .assets-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (min-width: 768px) {
            .assets-grid { grid-template-columns: 1fr 1fr; }
        }

        .asset-card {
            background: var(--panel-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .asset-card h4 {
            margin: 0 0 15px 0;
            font-family: monospace;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .media-placeholder {
            background: #080d1a;
            border-radius: 8px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .media-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Upgraded Code Snippet Container */
        .code-box {
            border-radius: 12px;
            overflow: hidden;
            background: #050811;
            border: 1px solid #1e293b;
        }

        .code-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0f19;
            padding: 15px 25px;
            border-bottom: 1px solid #1e293b;
        }

        .file-name {
            font-family: monospace;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .btn-copy {
            background: transparent;
            color: var(--accent-teal);
            border: 1px solid var(--accent-teal);
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: monospace;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background: var(--accent-teal);
            color: #050811;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        pre {
            margin: 0;
            padding: 25px;
            overflow-x: auto;
        }

        code {
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #a7f3d0;
        }

        footer {
            margin-top: 60px;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="app-layout">
        
        <!-- Sidebar Navigation Dashboard Frame -->
        <aside class="sidebar">
            <div class="brand-zone">
                <h1 class="logo">BitsToBytes</h1>
                <div class="tagline">IOT Build Repositories</div>
                
                <!-- Creator Status Center -->
                <div class="stats-panel">
                    <div class="stat-item">
                        <span class="stat-label">SYSTEM_STATUS:</span>
                        <span class="stat-val" style="color: var(--accent-green);">ONLINE</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">ACTIVE_NODES:</span>
                        <span class="stat-val">01 Vault</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">LICENSE:</span>
                        <span class="stat-val">MIT OPEN</span>
                    </div>
                </div>
            </div>

            <!-- Social Channel Buttons Stack -->
            <div class="social-stack">
                <a href="#" target="_blank" class="social-btn btn-yt">▶ YouTube Channel</a>
                <a href="#" target="_blank" class="social-btn btn-ig">📸 Instagram Feed</a>
            </div>
        </aside>

        <!-- Main Workspace Repository View -->
        <main class="main-content">
            <header class="section-header">
                <h2>Project Repositories</h2>
                <p>Download stable schematic layers and validated source script components.</p>
            </header>

            <!-- Project Module Box -->
            <section class="project-board">
